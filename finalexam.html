<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bchave Wallet</title>
  <!-- React UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script>
    // Fix for lucide-react UMD expecting 'react' instead of 'React'
    window.react = window.React;
    // Global error handler to display errors on screen
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      document.body.innerHTML += '<div style="color:red; padding: 20px; font-family: sans-serif; background: #fff; z-index: 9999; position: relative;">' +
        '<h3>Error:</h3><p>' + msg + '</p>' +
        '<p>Line: ' + lineNo + '</p>' +
        '</div>';
      return false;
    };
  </script>
  <!-- Babel Standalone for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons UMD -->
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
</head>

<body style="margin: 0; padding: 0; background: #E5E7EB;">
  <div id="root"></div>

  <script type="text/babel">
    // Extract hooks and components from global UMD objects
    const { useState } = React;
    const {
      Menu, Bell, ArrowDown, ArrowUpRight, Scan, QrCode,
      PiggyBank, CreditCard, Coins, Landmark, Download, Send,
      TrendingUp, Home, Activity, Wallet, Eye, ChevronRight, Zap, Bitcoin, User, Settings, Sun, Moon, Shield, Lock, Globe, Copy, Star, CheckCircle2
    } = window.LucideReact;

    const lightTheme = {
      bg: "#F5F7F6",
      surface: "#FFFFFF",
      primary: "#16A34A",
      primaryDark: "#0E3D2F",
      primaryLight: "#D1FAE5",
      text: "#111827",
      textSub: "#6B7280",
      border: "#E5E7EB",
      isDark: false,
    };

    const darkTheme = {
      bg: "#030712",
      surface: "#111827",
      primary: "#39ff14", // neon green
      primaryDark: "#10b981",
      primaryLight: "rgba(57,255,20,0.1)",
      text: "#F9FAFB",
      textSub: "#9CA3AF",
      border: "#374151",
      isDark: true,
    };

    const AppContext = React.createContext();
    const useAppContext = () => React.useContext(AppContext);

    const fonts = `
        @keyframes slideUp {
          from { transform: translateY(100%); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        .font-sans { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .neon-btn {
          position: relative;
        }
        .neon-btn:hover .neon-svg-border {
          opacity: 1 !important;
        }
        `;

    function fmtFiat(n, currency) {
      const rates = { PHP: 25000, USD: 450, EUR: 410, GBP: 350, JPY: 60000 };
      const rate = rates[currency] || 450;
      let locale = "en-US";
      if (currency === "PHP") locale = "en-PH";
      if (currency === "EUR") locale = "de-DE";
      if (currency === "GBP") locale = "en-GB";
      if (currency === "JPY") locale = "ja-JP";
      
      return "≈ " + (n * rate).toLocaleString(locale, { style: "currency", currency: currency, maximumFractionDigits: 2 });
    }

    function ActionButton({ icon: Icon, label }) {
      const { theme: c } = useAppContext();
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, flex: 1 }}>
          <div style={{
            width: "100%", height: 52, borderRadius: 14, background: c.primary,
            display: "flex", alignItems: "center", justifyContent: "center",

          }}>

          </div>
          <span className="font-sans" style={{ fontSize: 13, fontWeight: 500, color: c.text }}>{label}</span>
        </div>

    }

    function AccountRow({ icon: Icon, label, timestamp, bchAmount, phpAmount }) {
      const { theme: c } = useAppContext();

          }}>

    function NeonBorder() {
      return (

          <defs>
            <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="0" y="0" width="100%" height="100%" rx="16" ry="16" fill="none" stroke="#39ff14" strokeWidth="2" strokeDasharray="33.35 66.65" pathLength="100" filter="url(#neon-glow)">
            <animate attributeName="stroke-dashoffset" values="100;0" dur="1.5s" repeatCount="indefinite" />
          </rect>
          <rect x="0" y="0" width="100%" height="100%" rx="16" ry="16" fill="none" stroke="#00f3ff" strokeWidth="2" strokeDasharray="33.35 66.65" strokeDashoffset="-33.33" pathLength="100" filter="url(#neon-glow)">
            <animate attributeName="stroke-dashoffset" values="66.66;-33.33" dur="1.5s" repeatCount="indefinite" />
          </rect>
          <rect x="0" y="0" width="100%" height="100%" rx="16" ry="16" fill="none" stroke="#b026ff" strokeWidth="2" strokeDasharray="33.35 66.65" strokeDashoffset="-66.66" pathLength="100" filter="url(#neon-glow)">
            <animate attributeName="stroke-dashoffset" values="33.33;-66.66" dur="1.5s" repeatCount="indefinite" />
          </rect>
        </svg>

         let newLent = totalLent;
         let newBorrowed = totalBorrowed;
         let label = "";
         let typeVal = "";
         
         if (modalState.type === "Receive") {
             newBch += amt;
             label = "Received BCH";
             typeVal = "receive";
         } else if (modalState.type === "Send") {
             if (amt > newBch) { alert("Insufficient balance"); return; }
             newBch -= amt;
             label = `Sent to ${recipientStr.substring(0, 8)}...`;
             typeVal = "send";
         } else if (modalState.type === "Supply") {
             if (amt > newBch) { alert("Insufficient balance"); return; }
             newBch -= amt;
             newLent += amt;
             label = "Supplied BCH";
             typeVal = "send";
         } else if (modalState.type === "Withdraw") {
             if (amt > newLent) { alert("Insufficient supplied balance"); return; }
             newBch += amt;
             newLent -= amt;
             label = "Withdrew BCH";
             typeVal = "receive";
         } else if (modalState.type === "Borrow" || modalState.type.startsWith("Borrow from")) {
             let limit = modalState.lender ? modalState.lender.available : 1.5;
             if (!modalState.lender && (newBorrowed + amt > limit)) { alert("Borrow limit exceeded"); return; }
             if (modalState.lender && (amt > limit)) { alert(`Borrow limit exceeded (Max: ${limit} BCH)`); return; }
             newBch += amt;
             newBorrowed += amt;

             if (amt > newBch) { alert("Insufficient balance"); return; }
             if (amt > newBorrowed) { alert("Amount exceeds borrowed"); return; }
             newBch -= amt;
             newBorrowed -= amt;
             label = "Repaid BCH";
             typeVal = "send";
         }

         setTotalLent(newLent);
         setTotalBorrowed(newBorrowed);

                        )}
                        
                        <div style={{ background: isDark ? "rgba(255,255,255,0.05)" : "#f3f4f6", borderRadius: 16, padding: "16px", marginBottom: 20 }}>
                          <div className="font-sans" style={{ fontSize: 13, color: c.textSub, marginBottom: 8 }}>Amount (BCH)</div>
                          <input 
                            type="number" 
                            value={amountStr} 
                            onChange={e => setAmountStr(e.target.value)}
                            placeholder="0.00"
                            style={{ 
                              width: "100%", background: "transparent", border: "none", outline: "none", 
                              fontSize: 32, fontWeight: 700, color: c.text, fontFamily: "Inter, sans-serif" 
                            }} 
                          />
                          {modalState.lender && parseFloat(amountStr) > 0 && (
                            <div className="font-sans" style={{ marginTop: 12, fontSize: 13, color: c.textSub, borderTop: `1px solid ${c.border}`, paddingTop: 12 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                                <span>APR</span>
                                <span style={{ color: "#ff4d4d", fontWeight: 600 }}>{modalState.lender.apr}%</span>
                              </div>
                              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                                <span>Term</span>
                                <span>12 Months</span>
                              </div>
                              <div style={{ display: "flex", justifyContent: "space-between" }}>
                                <span>Monthly Payment</span>
                                <span style={{ color: c.text, fontWeight: 600 }}>
                                  {((parseFloat(amountStr) * (1 + modalState.lender.apr / 100)) / 12).toFixed(6)} BCH
                                </span>
                              </div>
                            </div>
                          )}
                        </div>
                        
                        {(() => {
                          let isTxValid = true;
                          const amt = parseFloat(amountStr);
                          if (isNaN(amt) || amt <= 0) isTxValid = false;
                          if (modalState.type === "Send" && !recipientStr.trim()) isTxValid = false;
                          
                          return (
                            <div className={isTxValid ? "neon-btn" : ""} onClick={isTxValid ? handleConfirmTx : undefined} style={{
                              padding: "16px 0", borderRadius: 16, 
                              background: isTxValid ? (isDark ? "rgba(57,255,20,0.1)" : c.primary) : (isDark ? "rgba(255,255,255,0.05)" : "#e5e7eb"),
                              border: isTxValid ? (isDark ? "1px solid rgba(57,255,20,0.3)" : "none") : "none", 
                              display: "flex", justifyContent: "center",
                              alignItems: "center", cursor: isTxValid ? "pointer" : "not-allowed", 
                              color: isTxValid ? (isDark ? "#39ff14" : "white") : (isDark ? "rgba(255,255,255,0.3)" : "#9ca3af"), 
                              fontWeight: 600, fontSize: 16,
                              transition: "all 0.2s"
                            }}>
                              {isDark && isTxValid && <NeonBorder />}
                              Confirm {modalState.type}
                            </div>
                          );
                        })()}
                      </>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </AppContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
